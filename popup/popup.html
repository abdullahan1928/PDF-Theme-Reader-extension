<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 12px; background: #2a2c2f; color: #e5e7ea; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    button { display: block; width: 100%; margin-top: 6px; padding: 7px 10px; text-align: left; color: inherit; background: #212326; border: 1px solid #3d4043; border-radius: 4px; font: inherit; cursor: pointer; }
    button:hover { background: #383b3f; }
    p { margin: 10px 0 0; color: #969ba1; font-size: 12px; }
  </style>
</head>
<body>
  <h1>PDF Theme Reader</h1>
  <button id="open">Open a PDF file</button>
  <button id="options">Settings</button>
  <p>PDF links and files open here automatically.</p>
  <script src="popup.js"></script>
</body>
</html>
